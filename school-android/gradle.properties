org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
# Left off deliberately: the Hilt Gradle plugin's aggregating task has historically
# been the first thing to break under configuration cache. Turn it on locally once
# you've confirmed a clean build works without it.
org.gradle.configuration-cache=false

android.useAndroidX=true
android.nonTransitiveRClass=true
android.defaults.buildfeatures.buildconfig=true

kotlin.code.style=official

# Dagger/Hilt: keep KSP incremental and fast.
ksp.incremental=true
