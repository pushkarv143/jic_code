# Nginx config baked into the school-frontend Docker image
# (school-frontend/Dockerfile copies this to /etc/nginx/conf.d/default.conf).
#
# This is the SIMPLE, single-service config: it only serves the already-built
# static React app and does the SPA fallback React Router needs. It does NOT
# proxy /api - in the docker-compose.yml setup, the browser talks to the
# backend container directly on its own published port (see
# VITE_API_BASE_URL=http://localhost:8080/api/v1 baked in at build time).
#
# For a config that fronts BOTH the frontend and backend behind one domain
# with a single reverse proxy (a more realistic production topology), see
# the standalone nginx/nginx.conf at the repository root instead.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
        text/javascript application/xml text/xml image/svg+xml;

    # Content-hashed build assets (Vite appends a hash to filenames) can be
    # cached aggressively; index.html itself must not be, or clients would
    # keep loading a stale shell after a redeploy.
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # React Router (client-side routing): any path that isn't a real file
    # on disk falls back to index.html so the SPA's own router can handle it.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
