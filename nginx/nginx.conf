# Reference "real deployment" Nginx config for the School Management System.
#
# NOT used by docker-compose.yml. The compose stack instead runs two much
# simpler, independent configs: school-frontend/nginx.conf (baked into the
# frontend image, only serves the SPA build + does the React Router
# fallback) and the backend's own embedded Tomcat on :8080, each published
# on its own host port (80 and 8080 respectively).
#
# This file shows how you would front BOTH services with a single Nginx
# sitting in front of a real domain - the frontend served as static files
# under "/" and the backend reverse-proxied under "/api/", so the browser
# only ever talks to one origin (avoiding CORS entirely and letting you
# put TLS in one place). To use it: point it at a checked-out copy of
# school-frontend/dist for the root location, run the backend jar/container
# reachable at 127.0.0.1:8080, and put this file at
# /etc/nginx/conf.d/school-sms.conf (or similar) on the box running Nginx.
#
# Swap `server_name your-domain.example.com;` for the real domain, and add
# TLS (listen 443 ssl; ssl_certificate ...;) as appropriate - omitted here
# to keep this focused on the app-routing part.

upstream sms_backend {
    # Backend Spring Boot app (embedded Tomcat), listening on 8080.
    server 127.0.0.1:8080;
}

server {
    listen 80;
    server_name your-domain.example.com;

    # ---------------------------------------------------------------
    # Basic security headers
    # ---------------------------------------------------------------
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ---------------------------------------------------------------
    # Gzip
    # ---------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript
        text/javascript application/xml text/xml image/svg+xml;

    # ---------------------------------------------------------------
    # / -> React (Vite build output) static files + SPA fallback for
    # client-side routes (react-router-dom).
    # ---------------------------------------------------------------
    root /var/www/school-frontend/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ---------------------------------------------------------------
    # /api/ -> Spring Boot backend. Controllers are mapped under the
    # /api/v1 base path already (it's part of each @RequestMapping, not a
    # servlet context-path), so the full path is simply forwarded as-is -
    # no rewrite/strip of the /api prefix is needed here.
    # ---------------------------------------------------------------
    location /api/ {
        proxy_pass http://sms_backend;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Generous timeouts for slower endpoints (e.g. bulk reports,
        # file uploads/downloads under 10MB per application.yml's
        # spring.servlet.multipart limits).
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Uploaded files served by the backend under /uploads/** (see
    # WebMvcConfig's resource handler) - also proxied so both static
    # assets and API calls share the one public origin.
    location /uploads/ {
        proxy_pass http://sms_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Swagger UI / OpenAPI docs (springdoc), disabled in application-prod.yml
    # by default - only useful if that profile's springdoc flags are
    # re-enabled for this deployment.
    location /swagger-ui/ {
        proxy_pass http://sms_backend;
        proxy_set_header Host $host;
    }

    location /v3/api-docs {
        proxy_pass http://sms_backend;
        proxy_set_header Host $host;
    }
}
