spring:
  application:
    name: school-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/school_management_system?useSSL=false&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
        jdbc:
          time_zone: UTC

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: 8080

app:
  jwt:
    secret: ${JWT_SECRET:MHpUaGlzSXNBRGV2RGVmYXVsdFNlY3JldEtleUZvckpXVFNpZ25pbmdQdXJwb3Nlc09ubHlDaGFuZ2VJblByb2R1Y3Rpb25FbnZpcm9ubWVudA==}
    access-token-expiration-ms: 900000
    refresh-token-expiration-ms: 604800000
  mail:
    from: ${MAIL_FROM:noreply@school.edu}
  frontend:
    url: ${FRONTEND_URL:http://localhost:5173}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  upload:
    dir: ${UPLOAD_DIR:./uploads}
    # Subfolders under `dir`. Defaults match the paths already stored in
    # students.photo_url etc., so changing one only affects newly uploaded files —
    # existing rows keep resolving against the folder they were written to.
    photos-subdir: ${UPLOAD_PHOTOS_SUBDIR:photos}
    documents-subdir: ${UPLOAD_DOCUMENTS_SUBDIR:documents}
    materials-subdir: ${UPLOAD_MATERIALS_SUBDIR:materials}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    root: INFO
    com.school.sms: INFO
