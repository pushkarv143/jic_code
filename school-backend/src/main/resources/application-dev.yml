spring:
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        highlight_sql: true

# Disable the mail health check in dev — SMTP creds are not set locally
# and a failed MailHealthIndicator turns the whole /actuator/health 503.
management:
  health:
    mail:
      enabled: false

logging:
  level:
    root: INFO
    com.school.sms: DEBUG
    org.hibernate.SQL: DEBUG

springdoc:
  swagger-ui:
    enabled: true
